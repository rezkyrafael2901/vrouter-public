<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- V gradient: bright gold top → deeper gold bottom -->
    <linearGradient id="vGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="40%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#C9A400"/>
    </linearGradient>

    <!-- Soft glow for ring/badge -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for V -->
    <filter id="vGlow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mask: hide ring behind left V arm -->
    <mask id="ringMask">
      <rect width="500" height="400" fill="white"/>
      <!-- Black area = hidden ring segment (behind left arm) -->
      <polygon points="140,40 215,40 250,300 215,300" fill="black"/>
    </mask>
  </defs>

  <!-- V letterform — single connected shape, sharp point at bottom -->
  <g filter="url(#vGlow)">
    <path d="M 128,50 L 250,330 L 372,50 L 320,50 L 250,250 L 180,50 Z"
          fill="url(#vGrad)"/>
    <!-- Inner highlight for center glow -->
    <path d="M 220,100 L 250,200 L 280,100 L 260,100 L 250,160 L 240,100 Z"
          fill="#FFF3B0" opacity="0.15"/>
  </g>

  <!-- Orbital ring — elliptical arc, masked behind left V arm -->
  <g filter="url(#softGlow)" mask="url(#ringMask)">
    <ellipse cx="250" cy="210" rx="200" ry="55"
             fill="none" stroke="url(#ringGrad)" stroke-width="3.5"
             opacity="0.9" transform="rotate(-8, 250, 210)"/>
  </g>

  <!-- Code badge on the ring (right side) -->
  <g filter="url(#softGlow)">
    <rect x="398" y="145" width="68" height="50" rx="14" ry="14"
          fill="#0A0A0A" stroke="#F5C518" stroke-width="3.5"/>
    <text x="432" y="177" text-anchor="middle"
          font-family="'SF Mono','Azeret Mono','Fira Code',monospace"
          font-size="20" font-weight="600" fill="#F5C518"
          letter-spacing="1">&lt; /&gt;</text>
  </g>
</svg>
