<header class="sticky top-0 z-50 border-b border-border bg-[#08090D]/80 backdrop-blur-xl">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
    <!-- LEFT: logo -->
    <a href="/" class="flex items-center gap-2 min-h-[44px] shrink-0">
      <img src="/static/vrouter-logo.svg" alt="{{ site_name }}" class="h-5 w-auto" />
      <span class="font-semibold text-[13px] tracking-tight text-primary hidden sm:inline">{{ site_name }}</span>
    </a>

    <!-- CENTER: nav links (desktop) -->
    <div class="hidden md:flex items-center gap-1">
      <a href="/#features" class="px-3 py-2 text-xs font-medium text-muted hover:text-primary rounded-lg transition-colors">Features</a>
      <a href="/docs" class="px-3 py-2 text-xs font-medium text-muted hover:text-primary rounded-lg transition-colors">Docs</a>
      <a href="/status" class="px-3 py-2 text-xs font-medium text-muted hover:text-primary rounded-lg transition-colors">Status</a>
      <a href="/#faq" class="px-3 py-2 text-xs font-medium text-muted hover:text-primary rounded-lg transition-colors">FAQ</a>
      {% if is_logged_in %}
      <a href="/dashboard" class="px-3 py-2 text-xs font-medium text-muted hover:text-primary rounded-lg transition-colors">Dashboard</a>
      {% endif %}
    </div>

    <!-- RIGHT: actions -->
    <div class="flex items-center gap-2">
      <!-- theme toggle -->
      <button onclick="toggleTheme()" class="p-2 rounded-lg text-muted hover:text-primary hover:bg-surface transition-colors" aria-label="Toggle theme">
        <svg class="w-4 h-4 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>

      {% if is_logged_in %}
      <a href="/auth/logout" class="text-xs text-muted hover:text-red-400 transition-colors px-2 py-2">Logout</a>
      {% else %}
      <a href="/auth" class="text-xs font-medium px-3 py-2 text-muted hover:text-primary transition-colors">Sign In</a>
      <a href="/auth?signup=true" class="text-xs font-medium px-4 py-2 rounded-md bg-accent text-white hover:opacity-90 transition-opacity">Get Started</a>
      {% endif %}
    </div>

    <!-- MOBILE hamburger -->
    <button onclick="toggleMobileNav()" class="md:hidden p-2 rounded-lg text-muted hover:text-primary hover:bg-surface transition-colors" aria-label="Menu" id="hamburger-btn">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </nav>

  <!-- MOBILE MENU -->
  <div id="mobile-nav-panel" class="hidden md:hidden border-t border-border bg-[#08090D] px-4 py-3">
    <a href="/#features" onclick="closeMobileNav()" class="block py-2.5 text-sm text-muted hover:text-primary">Features</a>
    <a href="/docs" onclick="closeMobileNav()" class="block py-2.5 text-sm text-muted hover:text-primary">Docs</a>
    <a href="/status" onclick="closeMobileNav()" class="block py-2.5 text-sm text-muted hover:text-primary">Status</a>
    <a href="/#faq" onclick="closeMobileNav()" class="block py-2.5 text-sm text-muted hover:text-primary">FAQ</a>
    {% if is_logged_in %}
    <a href="/dashboard" onclick="closeMobileNav()" class="block py-2.5 text-sm text-accent-bright">Dashboard</a>
    <a href="/auth/logout" onclick="closeMobileNav()" class="block py-2.5 text-sm text-red-400">Logout</a>
    {% else %}
    <a href="/auth" onclick="closeMobileNav()" class="block py-2.5 text-sm text-muted hover:text-primary">Sign In</a>
    {% endif %}
  </div>
</header>

<script>
function toggleMobileNav() {
  var panel = document.getElementById('mobile-nav-panel');
  if (panel) panel.classList.toggle('hidden');
}
function closeMobileNav() {
  var panel = document.getElementById('mobile-nav-panel');
  if (panel) panel.classList.add('hidden');
}
</script>
